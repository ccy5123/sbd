  bg_living:    {value: 35, low: 30, high: 45, units: dB(A), status: ASSUMPTION, source: "WHO 1999 Table 4.1 (35 dB LAeq,16h dwelling indoors)"}
  bg_office:    {value: 45, low: 43, high: 55, units: dB(A), status: VERIFIED, source: "Hongisto et al. 2017 Front Psychol 8:1177 (43-45 dB LAeq with masking)"}
  bg_restaurant: {value: 74, low: 67, high: 83, units: dB(A), status: VERIFIED, source: "To & Chung 2014 Noise Health 16:368 / 2015 Noise Vib Worldwide 46:11 (Leq 73.9, range 66.7-82.6 dBA); Lebo et al. 1994 (59-80 dBA, secondary)"}
  bg_subway:    {value: 77, low: 74, high: 80, units: dB(A), status: VERIFIED, source: "Yao et al. 2017 J Otolaryngol Head Neck Surg 46:62 (76.8 +/- 2.6 dBA in moving vehicle); NYC car maxima 112 dBA (Gershon et al. 2006)"}

  # --- M2 source / masking model (verified 2026-10-15; see refs/references.yaml) ---
  P_th:         {value: 600.0, low: 200.0, high: 1300.0, units: Pa, status: ASSUMPTION, source: "anchored to vocal-fold phonation threshold pressure 0.2-0.5 kPa (Titze 2009 JSLHR 52:1062; Jiang et al. 1999) and brass-lip threshold p0 = K f with K = 4-8 Pa/Hz (Fletcher & Tarnopolsky 1999 JASA 105:874), i.e. 0.64-1.28 kPa at 160 Hz; trumpet thresholds 1.05-4.1 kPa at 235-700 Hz (Doc et al. 2023)", note: "no anal-tissue data; nominal = K 3.75 Pa/Hz x 160 Hz"}
  C_d:          {value: 0.85, low: 0.6, high: 1.0, units: "-", status: PARTIAL, source: "glottal discharge coefficient 0.85 (van den Berg et al. 1957, k = 1.375); sharp slit 0.61 (Kirchhoff)"}
  alpha_mod:    {value: 0.7, low: 0.5, high: 1.0, units: "-", status: ASSUMPTION, source: "derived from glottal AC (p-p) / minimum flow 1.6-5.2 (Holmberg et al. 1988; Sulter & Wit 1996) and trombone total-flow p-p / mean 1.6-2.9 (Boutin et al. 2015)", note: "fundamental flow amplitude / mean flow; not tabulated anywhere"}
  harm_slope:   {value: -12.0, low: -18.0, high: -6.0, units: dB/octave, status: ASSUMPTION, note: "volume-flow harmonic roll-off (glottal source ~ -12 dB/oct); radiated pressure then falls 6 dB/oct slower"}
  n_harm:       {value: 8, units: "-", status: ASSUMPTION}
  A_cloth:      {value: 1.0, low: 0.0, high: 3.0, units: dB, status: PARTIAL, source: "VanDam 2014 JASA 136:EL263 (shirts: no difference vs bare microphone); mass law 0.3-0.4 kg/m2: 0.5 dB at 150 Hz, 2.6 dB at 300 Hz", note: "cushion seal: not found"}
  r_listener:   {value: 0.6, low: 0.4, high: 3.0, units: m, status: ASSUMPTION, note: "sofa neighbour 0.6 m; plan range 0.5-3 m"}
  CR:           {value: {100: 17.0, 500: 17.0, 1000: 18.0, 2000: 20.0, 4000: 23.0}, units: dB, status: PARTIAL, source: "critical ratio: ~17 dB (16-19) at 100-250 Hz (Hawkins & Stevens 1950, figure only; Moore, Peters & Glasberg 1990); 18 dB at 1 kHz (Scharf 1961)", note: "2-4 kHz values follow the usual rise; only the <= 1 kHz values matter here"}
  bg_slope:     {value: {library: -5.0, living: -5.0, office: -5.0, restaurant: -3.0, subway: -8.0}, units: dB/octave, status: ASSUMPTION, source: "RC neutral spectrum -5 dB/oct (Blazier 1981, 1997); restaurant babble speech-shaped (Byrne et al. 1994); subway interior low-frequency dominated, spectral maximum at 12.5 Hz (Lee, Kim & Han 2017)"}
acoustics_proxy:    # Gate 0 only - replaced by the lip-reed model in M2
  u_audible:    {value: 2.0, low: 1.0, high: 5.0, units: m/s, status: ASSUMPTION, note: "exit velocity above which tissue oscillation (sound) is assumed; placeholder for M2"}

perception:         # M6 (verified 2026-10-15; see refs/references.yaml)
  n_stevens:    {value: 0.28, low: 0.20, high: 0.45, units: "-", status: VERIFIED, source: "Collins et al. 2001 Am J Vet Res 62:1014 (odour rating = 1.51 [H2S ppm]^0.28); Amoore 1985 CARB report x1.2 per doubling (n = 0.26, non-peer-reviewed); thiols 0.36 and all odorants median 0.40 (Devos et al. 2002 via Zarzo 2012 Sensors 12:4105)", note: "range = sensitivity bracket"}
  k_w_H2S:      {value: 0.95, low: 0.8, high: 1.2, units: "intensity units per decade", status: PARTIAL, source: "Japan MoE 6-point scale: H2S 0.02 -> 0.2 ppm spans intensity 2.5 -> 3.5; municipal tables Y = 0.950 log10(ppm) + 4.14 (not read directly)"}
  weber_C:      {value: 0.28, low: 0.05, high: 0.40, units: "dC/C", status: VERIFIED, source: "Stone & Bosley 1965 Percept Mot Skills 20:657 (K = 0.28); Cain 1977 Science 195:796 (down to 0.05 with ideal delivery)"}
  tau_adapt:    {value: 80.0, low: 40.0, high: 120.0, units: s, status: ASSUMPTION, source: "derived: asymptote reached by ~4 min (Cain 1974 via Cometto-Muniz & Cain 1995) taken as ~3 tau"}
  a_inf:        {value: 0.35, low: 0.25, high: 0.40, units: "-", status: PARTIAL, source: "H2S, DMDS, pyridine 25-40 % of initial intensity (Berglund et al. 1978; Ekman et al. 1967; via Cometto-Muniz & Cain 1995)"}
  gamma_lit:    {value: 1.15, low: 1.0, high: 1.3, units: "-", status: ASSUMPTION, source: "direction verified: negative names raise intensity (Djordjevic et al. 2008); hazard framing causes sensitization instead of adaptation (Dalton 1996, 1997, 1999); label shifts pleasantness, not intensity (de Araujo et al. 2005); sounds shift pleasantness, not intensity (Seo & Hummel 2011)", note: "no study measures intensity for unexpected vs expected odours"}
  sniff_ratio:  {value: 0.64, low: 0.61, high: 0.75, units: "-", status: VERIFIED, source: "Frank et al. 2006 Arch Otolaryngol 132:532 (malodour sniff magnitude ratio); modulation latency 0.16-0.26 s (Johnson et al. 2003)"}
  t_react:      {value: 0.5, low: 0.3, high: 1.5, units: s, status: ASSUMPTION, note: "sound-to-breath-hold latency; reflex floor 0.16 s (Johnson et al. 2003)"}
  H_max:        {value: 33.0, low: 24.0, high: 90.0, units: s, status: VERIFIED, source: "Marks et al. 1997 JMRI 7:595 (31.7 s, room air, end-expiration); Roujol et al. 2014 MRM (35 +/- 11 s)", note: "upper bound after full inspiration is an ASSUMPTION"}
  recovery_gain: {value: 1.5, low: 1.0, high: 2.0, units: "-", status: ASSUMPTION, note: "tidal-volume factor of the first breath after a hold"}
